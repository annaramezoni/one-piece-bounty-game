<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <header class="header">
      <img class="header__logo" src="images/logo.png" alt="One piece logo" />
      <div class="header__bg"></div>
    </header>
    <main>
      <!-- ========= Carousel ========== -->
      <section class="carousel-section">
        <div class="section-title">
          <h2>The Straw Hat Crew</h2>
          <img src="images/jolly-roger.png" alt="One Piece jolly roger image" />
        </div>

        <div class="carousel__container">
          <button class="carousel__button --left" id="prev-button">
            <i class="fa-solid fa-2x fa-chevron-left"></i>
          </button>

          <ul class="carousel__card-list">
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Luffy-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Zoro-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Sanji-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Nami-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Usopp-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Chopper-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Nico-Robin-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Brook-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Franky-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Jinbe-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Going-Merry-card.png"
                alt="One piece character descriptive card" />
            </li>
            <li class="carousel__card">
              <img
                class="carousel__card-image"
                src="images/Sunny-card.png"
                alt="One piece character descriptive card" />
            </li>
          </ul>
          <button class="carousel__button --right" id="next-button">
            <i class="fa-solid fa-2x fa-chevron-right"></i>
          </button>
        </div>
        <div class="carousel__character-btns">
          <!-- <button onclick="displayCard(0)">Luffy</button> -->
        </div>
      </section>

      <!-- ========= Game ========== -->
      <section class="card-game">
        <div class="section-title">
          <h2>Bounty Game</h2>
          <img src="images/jolly-roger.png" alt="One Piece jolly roger image" />
        </div>

        <p id="character1" onclick="compareBounty(0)">Character 1</p>
        x
        <p id="character2" onclick="compareBounty(1)">Character 2</p>
        <p>Score:</p>
        <span class="score"></span>

        <!-- ######## Flip Card section ######## -->
        <div class="card-game__front-back" onClick="flipCard()">
          <!-- ===== front ===== -->
          <div class="card --front">
            <div class="card-image">
              <img
                src="images/Luffy-front.png"
                alt="character's image without bounty" />
            </div>
          </div>
          <!-- ===== back ===== -->
          <div class="card --back">
            <div class="card-image">
              <img src="images/Luffy.png" alt="character's image with bounty" />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
