<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header class="header"></header>
    <section class="bg-section"></section>
    <main>
      <!-- ========= Carousel ========== -->
      <section class="carousel-section">
        <div class="carousel__title">
          <h2>The Straw Hat Crew</h2>
          <img src="images/jolly-roger.png" />
        </div>

        <div class="carousel__track-container">
          <button class="carousel__button carousel__button--left">
            <i class="fa-solid fa-2x fa-chevron-left"></i>
          </button>

          <ul class="carousel__track">
            <li class="carousel__slide">
              <img src="images/Luffy.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Zoro.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Sanji.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Nami.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Usopp.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Chopper.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Nico-Robin.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Brooke.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Franky.png" />
            </li>
            <li class="carousel__slide">
              <img src="images/Jinbe.png" />
            </li>
          </ul>
          <button class="carousel__button --right">
            <i class="fa-solid fa-2x fa-chevron-right"></i>
          </button>
        </div>
      </section>

      <!-- ========= Game ========== -->
      <div class="card-front-back" id="card-front-back" onClick="handleClick()">
        <!-- ===== front ===== -->
        <div class="card --front">
          <div class="card-game">
            <img src="images/Luffy-front.png" />
          </div>
        </div>
        <!-- ===== back ===== -->
        <div class="card --back">
          <div class="card-game">
            <img src="images/Luffy.png" alt="" />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
